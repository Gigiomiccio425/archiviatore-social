name: Build & publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # amd64 (Zima classico) + arm64 (Zimablade/SBC): arm64 gira in emulazione
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # sulle PR non pubblichiamo: build di sola verifica
      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag e label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build e push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Avvia davvero l'immagine appena pubblicata (per digest, cosi' non
      # dipendiamo da come sono stati calcolati i tag) e aspetta /health.
      - name: Smoke test dell'immagine
        if: github.event_name != 'pull_request'
        run: |
          docker run -d --name smoke -p 8080:8080 \
            -e DOWNLOAD_DIR=/tmp/dl -e DATA_DIR=/tmp/data -e UPDATE_YTDLP=false \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health; then
              echo "" && echo "smoke test OK" && exit 0
            fi
            sleep 2
          done
          echo "healthcheck fallito"
          docker logs smoke
          exit 1

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Crea la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Immagine Docker

            ```
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ```

            Piattaforme: `linux/amd64`, `linux/arm64`.

            Installazione su Zima OS / CasaOS: vedi `casaos-app.yml` nel repo.
