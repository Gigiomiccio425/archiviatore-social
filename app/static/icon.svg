<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="55%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#7f1d3a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect width="256" height="256" rx="56" fill="url(#shine)"/>

  <!-- schermo / play -->
  <g filter="url(#soft)">
    <rect x="42" y="58" width="172" height="106" rx="22" fill="#0f172a" fill-opacity="0.92"/>
    <path d="M111 90 L153 111 L111 132 Z" fill="#ffffff"/>
  </g>

  <!-- freccia download -->
  <g stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M128 176 V212"/>
    <path d="M104 192 L128 214 L152 192"/>
  </g>
</svg>
